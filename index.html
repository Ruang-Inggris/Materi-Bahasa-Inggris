<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Inggris - Fantasy Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Efek 3D dan animasi menggemaskan untuk tombol */
        .cute-btn {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .cute-btn:hover {
            transform: translateY(-8px) scale(1.03) rotate(1.5deg);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body class="font-sans text-slate-800 min-h-screen" style="background-image: url('background.jpg'); background-size: cover; background-position: center; background-attachment: fixed;">
    
    <!-- Overlay transparan agar tombol tetap terbaca di atas gambar -->
    <div class="min-h-screen bg-black/30 py-10 px-4 flex flex-col items-center">
        
        <div class="w-full max-w-3xl">
            
            <!-- Header Papan Imut -->
            <div class="bg-[#fff9e6] border-[6px] border-[#ffb6b9] rounded-[3rem] p-8 text-center shadow-xl mb-12 relative transform rotate-1 hover:-rotate-1 transition-transform duration-300">
                <div class="absolute -top-6 -left-4 text-5xl animate-bounce">✨</div>
                <div class="absolute -bottom-4 -right-4 text-5xl">🌸</div>
                <h1 class="text-4xl md:text-5xl font-extrabold text-[#d9777f] drop-shadow-sm mb-2 tracking-wide" style="font-family: 'Comic Sans MS', cursive, sans-serif;">Ruang Inggris</h1>
                <p class="text-[#b85b63] font-bold text-lg md:text-xl">Temukan semua materi bahasa Inggris seru di sini!</p>
            </div>

            <!-- Grid Menu 2 Kolom (3 Kiri, 3 Kanan) -->
