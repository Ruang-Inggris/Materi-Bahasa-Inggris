<!DOCTYPE html>
<html lang="id">
<head>

    <title>Ruang Inggris - Fantasy Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .game-btn {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-btn:hover {
            transform: translateY(-5px) scale(1.05);

        }
    </style>
</head>

<!-- KODE DIREVISI: Memanggil nama file background.jpg.png sesuai dengan yang ada di GitHub -->
<body class="font-sans text-slate-800 min-h-screen" style="background-image: url('background.jpg.png'); background-size: cover; background-position: center; background-attachment: fixed;">
